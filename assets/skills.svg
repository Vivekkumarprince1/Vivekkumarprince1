<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vivek Kumar - Technical Arsenal &amp; Engineering Stack">
  <defs>
    <!-- Background & Card Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="skillsGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1280" height="520" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1280" height="520" rx="16" fill="url(#skillsGrid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(48, 36)">
    <rect width="180" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#3B82F6"/>
    <text x="24" y="17" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM_CAPABILITIES</text>

    <text x="0" y="58" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      Technical Arsenal <tspan fill="#3B82F6">&amp;</tspan> Engineering Stack
    </text>
    <text x="0" y="80" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Production-tested technologies applied across distributed systems, real-time media, and multi-tenant architectures.
    </text>
  </g>

  <!-- 4 Primary Domain Cards (2x2 Grid) -->

  <!-- CARD 1: LANGUAGES & RUNTIMES (Top-Left) -->
  <g transform="translate(48, 140)">
    <rect width="570" height="152" rx="12" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#blueGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">01 // LANGUAGES &amp; CORE RUNTIMES</text>
    <line x1="24" y1="46" x2="546" y2="46" stroke="#1E293B" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <!-- TypeScript -->
    <g transform="translate(24, 60)">
      <rect width="118" height="30" rx="6" fill="#0B0F19" stroke="#3178C6" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#3178C6"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TypeScript</text>
    </g>
    <!-- JavaScript ES6+ -->
    <g transform="translate(150, 60)">
      <rect width="144" height="30" rx="6" fill="#0B0F19" stroke="#F7DF1E" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#F7DF1E"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">JavaScript (ES6+)</text>
    </g>
    <!-- C++17 -->
    <g transform="translate(302, 60)">
      <rect width="90" height="30" rx="6" fill="#0B0F19" stroke="#00599C" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#00599C"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C++17</text>
    </g>
    <!-- C -->
    <g transform="translate(400, 60)">
      <rect width="64" height="30" rx="6" fill="#0B0F19" stroke="#A8B9CC" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#A8B9CC"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C</text>
    </g>
    <!-- SQL -->
    <g transform="translate(472, 60)">
      <rect width="74" height="30" rx="6" fill="#0B0F19" stroke="#4479A1" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#4479A1"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SQL</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">PARADIGMS:</text>
      <text x="84" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Object-Oriented Design · Async/Event Loop · Memory-Safe Patterns · Multithreading
      </text>
    </g>
  </g>

