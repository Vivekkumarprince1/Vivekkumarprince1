<svg width="100%" height="auto" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vivek Kumar - Technical Arsenal and Engineering Stack">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Grid Patterns -->
    <pattern id="skillsGridDark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="skillsGridLight" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.6" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .skills-bg { fill: url(#bgGradDark); }
      .skills-grid { fill: url(#skillsGridDark); }
      .skills-border { stroke: #1E293B; }
      .skills-title { fill: #FFFFFF; }
      .skills-sub { fill: #94A3B8; }
      .skills-badge-box { fill: #1E293B; stroke: #334155; }
      .skills-card { fill: url(#cardGradDark); stroke: #1E293B; }
      .skills-line { stroke: #1E293B; }
      .tag-box { fill: #0B0F19; }
      .tag-text { fill: #E2E8F0; }
      .label-head { fill: #64748B; }
      .label-desc { fill: #94A3B8; }

      @media (prefers-color-scheme: light) {
        .skills-bg { fill: url(#bgGradLight); }
        .skills-grid { fill: url(#skillsGridLight); }
        .skills-border { stroke: #CBD5E1; }
        .skills-title { fill: #0F172A; }
        .skills-sub { fill: #475569; }
        .skills-badge-box { fill: #FFFFFF; stroke: #CBD5E1; }
        .skills-card { fill: url(#cardGradLight); stroke: #CBD5E1; }
        .skills-line { stroke: #E2E8F0; }
        .tag-box { fill: #F1F5F9; }
        .tag-text { fill: #0F172A; }
        .label-head { fill: #64748B; }
        .label-desc { fill: #334155; }
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="1280" height="520" rx="16" class="skills-bg" stroke-width="1.5"/>
  <rect width="1280" height="520" rx="16" class="skills-grid"/>

  <!-- Top Header Bar -->
  <g transform="translate(48, 36)">
    <rect width="180" height="26" rx="6" class="skills-badge-box" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#0284C7"/>
    <text x="24" y="17" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">SYSTEM_CAPABILITIES</text>

    <text x="0" y="58" class="skills-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
      Technical Arsenal <tspan fill="#0284C7">&amp;</tspan> Engineering Stack
    </text>
    <text x="0" y="80" class="skills-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
      Production-tested technologies applied across distributed systems, real-time media, and multi-tenant architectures.
    </text>
  </g>

  <!-- 4 Primary Domain Cards (2x2 Grid) -->

  <!-- CARD 1: LANGUAGES & RUNTIMES (Top-Left) -->
  <g transform="translate(48, 140)">
    <rect width="570" height="152" rx="12" class="skills-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#blueGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">01 // LANGUAGES &amp; CORE RUNTIMES</text>
    <line x1="24" y1="46" x2="546" y2="46" class="skills-line" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <g transform="translate(24, 60)">
      <rect width="118" height="30" rx="6" class="tag-box" stroke="#3178C6" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#3178C6"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">TypeScript</text>
    </g>
    <g transform="translate(150, 60)">
      <rect width="144" height="30" rx="6" class="tag-box" stroke="#EAB308" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#EAB308"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">JavaScript (ES6+)</text>
    </g>
    <g transform="translate(302, 60)">
      <rect width="90" height="30" rx="6" class="tag-box" stroke="#00599C" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#00599C"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C++17</text>
    </g>
    <g transform="translate(400, 60)">
      <rect width="64" height="30" rx="6" class="tag-box" stroke="#64748B" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#64748B"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C</text>
    </g>
    <g transform="translate(472, 60)">
      <rect width="74" height="30" rx="6" class="tag-box" stroke="#4479A1" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#4479A1"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">SQL</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" class="label-head" font-family="'JetBrains Mono', monospace" font-size="11">PARADIGMS:</text>
      <text x="84" y="18" class="label-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Object-Oriented Design · Async/Event Loop · Memory-Safe Patterns · Multithreading
      </text>
    </g>
  </g>

  <!-- CARD 2: BACKEND, REAL-TIME & AI (Top-Right) -->
  <g transform="translate(662, 140)">
    <rect width="570" height="152" rx="12" class="skills-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#greenGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">02 // BACKEND, REAL-TIME &amp; AI</text>
    <line x1="24" y1="46" x2="546" y2="46" class="skills-line" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <g transform="translate(24, 60)">
      <rect width="96" height="30" rx="6" class="tag-box" stroke="#16A34A" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#16A34A"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Node.js</text>
    </g>
    <g transform="translate(128, 60)">
      <rect width="108" height="30" rx="6" class="tag-box" stroke="#64748B" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#64748B"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Express.js</text>
    </g>
    <g transform="translate(244, 60)">
      <rect width="104" height="30" rx="6" class="tag-box" stroke="#0284C7" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#0284C7"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Socket.IO</text>
    </g>
    <g transform="translate(356, 60)">
      <rect width="90" height="30" rx="6" class="tag-box" stroke="#DB2777" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#DB2777"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">WebRTC</text>
    </g>
    <g transform="translate(454, 60)">
      <rect width="92" height="30" rx="6" class="tag-box" stroke="#9333EA" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#9333EA"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Gemini AI</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" class="label-head" font-family="'JetBrains Mono', monospace" font-size="11">CAPABILITIES:</text>
      <text x="96" y="18" class="label-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        180+ REST APIs · BullMQ Queues · Sub-500ms Audio Stream · AI Bot Flows
      </text>
    </g>
  </g>

  <!-- CARD 3: DATABASES & STORAGE (Bottom-Left) -->
  <g transform="translate(48, 308)">
    <rect width="570" height="152" rx="12" class="skills-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#amberGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">03 // DATABASES, CACHING &amp; STORAGE</text>
    <line x1="24" y1="46" x2="546" y2="46" class="skills-line" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <g transform="translate(24, 60)">
      <rect width="128" height="30" rx="6" class="tag-box" stroke="#16A34A" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#16A34A"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MongoDB Atlas</text>
    </g>
    <g transform="translate(160, 60)">
      <rect width="112" height="30" rx="6" class="tag-box" stroke="#DC2626" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#DC2626"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Redis Cache</text>
    </g>
    <g transform="translate(280, 60)">
      <rect width="84" height="30" rx="6" class="tag-box" stroke="#00758F" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#00758F"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MySQL</text>
    </g>
    <g transform="translate(372, 60)">
      <rect width="138" height="30" rx="6" class="tag-box" stroke="#3448C5" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#3448C5"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Cloudinary CDN</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" class="label-head" font-family="'JetBrains Mono', monospace" font-size="11">RELIABILITY:</text>
      <text x="94" y="18" class="label-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        ACID Wallet Ledgers · Aggregation Pipelines · TTL LRU Caching · Index Tuning
      </text>
    </g>
  </g>

  <!-- CARD 4: CLOUD, DEVOPS & INFRA (Bottom-Right) -->
  <g transform="translate(662, 308)">
    <rect width="570" height="152" rx="12" class="skills-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#purpleGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#7C3AED" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">04 // CLOUD, DEVOPS &amp; SECURITY</text>
    <line x1="24" y1="46" x2="546" y2="46" class="skills-line" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <g transform="translate(24, 60)">
      <rect width="88" height="30" rx="6" class="tag-box" stroke="#0284C7" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#0284C7"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Docker</text>
    </g>
    <g transform="translate(120, 60)">
      <rect width="114" height="30" rx="6" class="tag-box" stroke="#2563EB" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#2563EB"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Kubernetes</text>
    </g>
    <g transform="translate(242, 60)">
      <rect width="138" height="30" rx="6" class="tag-box" stroke="#0284C7" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#0284C7"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">GitHub Actions</text>
    </g>
    <g transform="translate(388, 60)">
      <rect width="84" height="30" rx="6" class="tag-box" stroke="#0078D4" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#0078D4"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Azure</text>
    </g>
    <g transform="translate(480, 60)">
      <rect width="66" height="30" rx="6" class="tag-box" stroke="#059669" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#059669"/>
      <text x="22" y="19" class="tag-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RBAC</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" class="label-head" font-family="'JetBrains Mono', monospace" font-size="11">DEPLOYMENT:</text>
      <text x="100" y="18" class="label-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        GitOps · Helm Charts · Zero-Trust Auth · Linux SysAdmin · Multi-Stage Builds
      </text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="48" y="480" width="1184" height="1" class="skills-line"/>
</svg>
