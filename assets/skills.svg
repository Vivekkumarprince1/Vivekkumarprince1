  <g transform="translate(662, 140)">
    <rect width="570" height="152" rx="12" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#greenGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">02 // BACKEND, REAL-TIME &amp; AI</text>
    <line x1="24" y1="46" x2="546" y2="46" stroke="#1E293B" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <!-- Node.js -->
    <g transform="translate(24, 60)">
      <rect width="96" height="30" rx="6" fill="#0B0F19" stroke="#22C55E" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#22C55E"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Node.js</text>
    </g>
    <!-- Express.js -->
    <g transform="translate(128, 60)">
      <rect width="108" height="30" rx="6" fill="#0B0F19" stroke="#64748B" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#94A3B8"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Express.js</text>
    </g>
    <!-- Socket.IO -->
    <g transform="translate(244, 60)">
      <rect width="104" height="30" rx="6" fill="#0B0F19" stroke="#38BDF8" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#38BDF8"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Socket.IO</text>
    </g>
    <!-- WebRTC -->
    <g transform="translate(356, 60)">
      <rect width="90" height="30" rx="6" fill="#0B0F19" stroke="#F472B6" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#F472B6"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">WebRTC</text>
    </g>
    <!-- Gemini AI -->
    <g transform="translate(454, 60)">
      <rect width="92" height="30" rx="6" fill="#0B0F19" stroke="#A855F7" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#A855F7"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Gemini AI</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">CAPABILITIES:</text>
      <text x="96" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        180+ REST APIs · BullMQ Queues · Sub-500ms Audio Stream · AI Bot Flows
      </text>
    </g>
  </g>

  <!-- CARD 3: DATABASES & STORAGE (Bottom-Left) -->
  <g transform="translate(48, 308)">
    <rect width="570" height="152" rx="12" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#amberGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">03 // DATABASES, CACHING &amp; STORAGE</text>
    <line x1="24" y1="46" x2="546" y2="46" stroke="#1E293B" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <!-- MongoDB -->
    <g transform="translate(24, 60)">
      <rect width="128" height="30" rx="6" fill="#0B0F19" stroke="#10AA50" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#10AA50"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MongoDB Atlas</text>
    </g>
    <!-- Redis -->
    <g transform="translate(160, 60)">
      <rect width="112" height="30" rx="6" fill="#0B0F19" stroke="#EF4444" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#EF4444"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Redis Cache</text>
    </g>
    <!-- MySQL -->
    <g transform="translate(280, 60)">
      <rect width="84" height="30" rx="6" fill="#0B0F19" stroke="#00758F" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#00758F"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">MySQL</text>
    </g>
    <!-- Cloudinary CDN -->
    <g transform="translate(372, 60)">
      <rect width="138" height="30" rx="6" fill="#0B0F19" stroke="#3448C5" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#3448C5"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Cloudinary CDN</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">RELIABILITY:</text>
      <text x="94" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        ACID Wallet Ledgers · Aggregation Pipelines · TTL LRU Caching · Index Tuning
      </text>
    </g>
  </g>

  <!-- CARD 4: CLOUD, DEVOPS & INFRA (Bottom-Right) -->
  <g transform="translate(662, 308)">
    <rect width="570" height="152" rx="12" fill="url(#cardGrad1)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="152" rx="2" fill="url(#purpleGlow)"/>
    
    <!-- Title -->
    <text x="24" y="32" fill="#C084FC" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">04 // CLOUD, DEVOPS &amp; SECURITY</text>
    <line x1="24" y1="46" x2="546" y2="46" stroke="#1E293B" stroke-width="1"/>

    <!-- Tags Row 1 -->
    <!-- Docker -->
    <g transform="translate(24, 60)">
      <rect width="88" height="30" rx="6" fill="#0B0F19" stroke="#2496ED" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#2496ED"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Docker</text>
    </g>
    <!-- Kubernetes -->
    <g transform="translate(120, 60)">
      <rect width="114" height="30" rx="6" fill="#0B0F19" stroke="#326CE5" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#326CE5"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Kubernetes</text>
    </g>
    <!-- GitHub Actions -->
    <g transform="translate(242, 60)">
      <rect width="138" height="30" rx="6" fill="#0B0F19" stroke="#2088FF" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#2088FF"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">GitHub Actions</text>
    </g>
    <!-- Microsoft Azure -->
    <g transform="translate(388, 60)">
      <rect width="84" height="30" rx="6" fill="#0B0F19" stroke="#0078D4" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#0078D4"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Azure</text>
    </g>
    <!-- JWT & RBAC -->
    <g transform="translate(480, 60)">
      <rect width="66" height="30" rx="6" fill="#0B0F19" stroke="#10B981" stroke-width="1"/>
      <circle cx="12" cy="15" r="3" fill="#10B981"/>
      <text x="22" y="19" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">RBAC</text>
    </g>

    <!-- Tags Row 2 -->
    <g transform="translate(24, 102)">
      <text x="0" y="18" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">DEPLOYMENT:</text>
      <text x="100" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        GitOps · Helm Charts · Zero-Trust Auth · Linux SysAdmin · Multi-Stage Builds
      </text>
    </g>
  </g>

  <!-- Bottom Accent Stripe -->
  <rect x="48" y="480" width="1184" height="1" fill="#1E293B"/>
</svg>

