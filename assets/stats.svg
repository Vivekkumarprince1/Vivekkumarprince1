<svg width="100%" height="auto" viewBox="0 0 1280 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vivek Kumar - Engineering Metrics and Production Telemetry">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="statBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="statBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="statCardDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="statCardLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Grid Patterns -->
    <pattern id="statGridDark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>
    <pattern id="statGridLight" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.6"/>
    </pattern>

    <style>
      .stats-bg { fill: url(#statBgDark); }
      .stats-grid { fill: url(#statGridDark); }
      .stats-card { fill: url(#statCardDark); stroke: #1E293B; }
      .stats-num { fill: #FFFFFF; }
      .stats-label { fill: #94A3B8; }
      .stats-sub { fill: #64748B; }
      .stats-top-badge { fill: #1E293B; stroke: #334155; }
      .stats-title { fill: #FFFFFF; }

      @media (prefers-color-scheme: light) {
        .stats-bg { fill: url(#statBgLight); }
        .stats-grid { fill: url(#statGridLight); }
        .stats-card { fill: url(#statCardLight); stroke: #CBD5E1; }
        .stats-num { fill: #0F172A; }
        .stats-label { fill: #334155; }
        .stats-sub { fill: #64748B; }
        .stats-top-badge { fill: #FFFFFF; stroke: #CBD5E1; }
        .stats-title { fill: #0F172A; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="440" rx="16" class="stats-bg" stroke="#1E293B" stroke-width="1.5"/>
  <rect width="1280" height="440" rx="16" class="stats-grid"/>

  <!-- Top Title Header -->
  <g transform="translate(48, 28)">
    <rect width="210" height="24" rx="6" class="stats-top-badge" stroke-width="1"/>
    <circle cx="12" cy="12" r="3.5" fill="#0284C7"/>
    <text x="22" y="16" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.2">SYSTEMS_TELEMETRY // LIVE</text>
    
    <text x="0" y="52" class="stats-title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">
      Production Metrics <tspan fill="#0284C7">&amp;</tspan> Engineering Benchmarks
    </text>
  </g>

  <!-- 6 Stat Cards (2 Rows x 3 Columns) -->

  <!-- ================= ROW 1 ================= -->

  <!-- Tile 1: Git Contributions -->
  <g transform="translate(48, 106)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#22C55E"/>
    
    <text x="20" y="28" fill="#16A34A" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CODE ACTIVITY</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">770+</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">GitHub Contributions</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Consistent production commits &amp; architecture</text>
  </g>

  <!-- Tile 2: Production APIs & DB Models -->
  <g transform="translate(452, 106)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#0284C7"/>
    
    <text x="20" y="28" fill="#0284C7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">API ARCHITECTURE</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">180+ APIs</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">70+ Models · Multi-Tenant</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ConnectSphere isolated tenant workflows</text>
  </g>

  <!-- Tile 3: Realtime Latency -->
  <g transform="translate(856, 106)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#10B981"/>
    
    <text x="20" y="28" fill="#059669" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">LOW-LATENCY PIPELINE</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">32ms Buffer</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">4x Audio Latency Reduction</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Vaani VAD &amp; sub-500ms AI translation</text>
  </g>

  <!-- ================= ROW 2 ================= -->

  <!-- Tile 4: Regional Edge CDN -->
  <g transform="translate(48, 268)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#7C3AED"/>
    
    <text x="20" y="28" fill="#7C3AED" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DISTRIBUTED EDGE</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">3 Nodes</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">C++17 Regional CDN</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Delhi · Mumbai · Bengaluru GeoIP routing</text>
  </g>

  <!-- Tile 5: DSA Problem Solving -->
  <g transform="translate(452, 268)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#D97706"/>
    
    <text x="20" y="28" fill="#D97706" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ALGORITHMIC MASTERY</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">500+</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">DSA Problems Solved</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">LeetCode &amp; GFG · Trees, Graphs, DP</text>
  </g>

  <!-- Tile 6: Gemini AI Resolution -->
  <g transform="translate(856, 268)">
    <rect width="374" height="142" rx="12" class="stats-card" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="3" rx="1.5" fill="#DB2777"/>
    
    <text x="20" y="28" fill="#DB2777" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">AI AUTOMATION</text>
    <text x="20" y="74" class="stats-num" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-1">90%+</text>
    <text x="20" y="102" class="stats-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Automated Bot Resolution</text>
    <text x="20" y="124" class="stats-sub" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gemini AI multi-turn conversational engine</text>
  </g>
</svg>
