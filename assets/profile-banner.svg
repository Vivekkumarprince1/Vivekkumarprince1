<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Vivek Kumar — Full-Stack Engineer</title>
  <desc id="description">A dark slate developer portfolio banner with green and blue accents.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="480" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="58" r="120" fill="#22C55E" fill-opacity="0.12" filter="url(#glow)"/>
  <circle cx="995" cy="315" r="105" fill="#38BDF8" fill-opacity="0.12" filter="url(#glow)"/>

  <rect x="64" y="52" width="168" height="34" rx="17" fill="#22C55E" fill-opacity="0.12" stroke="#22C55E" stroke-opacity="0.45"/>
  <circle cx="84" cy="69" r="5" fill="#22C55E"/>
  <text x="98" y="75" fill="#BBF7D0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">OPEN TO WORK</text>

  <text x="64" y="164" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="68" font-weight="750" letter-spacing="-2">Vivek Kumar</text>
  <rect x="64" y="190" width="412" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="238" fill="#CBD5E1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="22" font-weight="500" letter-spacing="2.4">FULL-STACK ENGINEER · PRODUCT BUILDER</text>
  <text x="64" y="282" fill="#94A3B8" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="17">Designing dependable systems from interface to infrastructure.</text>

  <g transform="translate(936 94)">
    <rect width="176" height="176" rx="34" fill="#1E293B" stroke="#475569"/>
    <rect x="14" y="14" width="148" height="148" rx="25" stroke="#334155"/>
    <text x="88" y="110" text-anchor="middle" fill="url(#accent)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" letter-spacing="-5">VK</text>
    <path d="M50 132H126" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" stroke="#475569" stroke-opacity="0.75" stroke-width="1.5"/>
</svg>
