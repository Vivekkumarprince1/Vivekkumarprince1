<svg width="1280" height="180" viewBox="0 0 1280 180" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Kumar's product engineering process</title>
  <desc id="desc">A five-step process: understand, design, build, ship, improve.</desc>
  <rect width="1280" height="180" rx="16" fill="#18181B"/>
  <path d="M126 90H1154" stroke="#52525B" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(126)"><circle cy="90" r="25" fill="#2563EB"/><text y="96" fill="white" font-size="16" font-weight="700">01</text><text y="145" fill="#FAFAFA" font-size="15" font-weight="700" letter-spacing="1">UNDERSTAND</text></g>
    <g transform="translate(383)"><circle cy="90" r="25" fill="#27272A" stroke="#71717A"/><text y="96" fill="white" font-size="16" font-weight="700">02</text><text y="145" fill="#FAFAFA" font-size="15" font-weight="700" letter-spacing="1">DESIGN</text></g>
    <g transform="translate(640)"><circle cy="90" r="25" fill="#27272A" stroke="#71717A"/><text y="96" fill="white" font-size="16" font-weight="700">03</text><text y="145" fill="#FAFAFA" font-size="15" font-weight="700" letter-spacing="1">BUILD</text></g>
    <g transform="translate(897)"><circle cy="90" r="25" fill="#27272A" stroke="#71717A"/><text y="96" fill="white" font-size="16" font-weight="700">04</text><text y="145" fill="#FAFAFA" font-size="15" font-weight="700" letter-spacing="1">SHIP</text></g>
    <g transform="translate(1154)"><circle cy="90" r="25" fill="#22C55E"/><text y="96" fill="#052E16" font-size="16" font-weight="700">05</text><text y="145" fill="#FAFAFA" font-size="15" font-weight="700" letter-spacing="1">IMPROVE</text></g>
  </g>
</svg>
