<svg width="100%" height="auto" viewBox="0 0 1200 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vivek Kumar — Software Engineer &amp; Systems Architect</title>
  <desc id="desc">Professional engineering header featuring Vivek Kumar and an animated glassmorphic system architecture visualizer.</desc>
  
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="1200" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C14"/>
      <stop offset="0.5" stop-color="#0D1527"/>
      <stop offset="1" stop-color="#060910"/>
    </linearGradient>

    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="1200" y2="370" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="nameGradDark" x1="80" y1="120" x2="480" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="nameGradLight" x1="80" y1="120" x2="480" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.7" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="80" y1="180" x2="520" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    
    <linearGradient id="cyanEmeraldGrad" x1="720" y1="40" x2="1140" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glassGradDark" x1="720" y1="40" x2="720" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glassGradLight" x1="720" y1="40" x2="720" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Grid Patterns -->
    <pattern id="gridDark" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5"/>
      <circle cx="36" cy="0" r="1" fill="#334155" opacity="0.6"/>
    </pattern>
    <pattern id="gridLight" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#CBD5E1" stroke-width="0.8" stroke-opacity="0.6"/>
      <circle cx="36" cy="0" r="1" fill="#94A3B8" opacity="0.6"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseBeacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes flowPacket {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes scanBeam {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }

      .pulse-dot { animation: pulseBeacon 2s ease-in-out infinite; transform-origin: center; }
      .packet-stream { stroke-dasharray: 6 10; animation: flowPacket 4s linear infinite; }
      .scan-line { stroke-dasharray: 80 200; animation: scanBeam 8s linear infinite; }

      /* Dark Theme Classes */
      .bg-base { fill: url(#bgGradDark); }
      .bg-grid { fill: url(#gridDark); }
      .name-text { fill: url(#nameGradDark); }
      .code-bg { fill: #090D16; stroke: #1E293B; }
      .status-badge-bg { fill: #1E293B; stroke: #334155; }
      .status-text { fill: #94A3B8; }
      .desc-text { fill: #94A3B8; }
      .sub-meta { fill: #64748B; }
      .hud-box { fill: url(#glassGradDark); stroke: url(#cyanEmeraldGrad); }
      .hud-head-bar { stroke: #1E293B; }
      .hud-title { fill: #64748B; }
      .hud-node-bg { fill: #0B1120; stroke: #1E293B; }
      .hud-node-text { fill: #94A3B8; }
      .hud-k8s-box { fill: #090E17; stroke: #1E293B; }
      .tech-line { stroke: #1E293B; }

      /* Light Theme Overrides */
      @media (prefers-color-scheme: light) {
        .bg-base { fill: url(#bgGradLight); }
        .bg-grid { fill: url(#gridLight); }
        .name-text { fill: url(#nameGradLight); }
        .code-bg { fill: #FFFFFF; stroke: #CBD5E1; }
        .status-badge-bg { fill: #FFFFFF; stroke: #CBD5E1; }
        .status-text { fill: #475569; }
        .desc-text { fill: #334155; }
        .sub-meta { fill: #64748B; }
        .hud-box { fill: url(#glassGradLight); stroke: #CBD5E1; }
        .hud-head-bar { stroke: #E2E8F0; }
        .hud-title { fill: #475569; }
        .hud-node-bg { fill: #F8FAFC; stroke: #CBD5E1; }
        .hud-node-text { fill: #334155; }
        .hud-k8s-box { fill: #F1F5F9; stroke: #E2E8F0; }
        .tech-line { stroke: #CBD5E1; }
      }
    </style>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="370" rx="16" class="bg-base"/>
  <rect width="1200" height="370" rx="16" class="bg-grid"/>

  <!-- Ambient Glow Elements -->
  <circle cx="1020" cy="180" r="140" fill="#6366F1" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="180" cy="290" r="110" fill="#06B6D4" fill-opacity="0.06" filter="url(#glow)"/>
  <circle cx="880" cy="80" r="90" fill="#10B981" fill-opacity="0.05" filter="url(#glow)"/>

  <!-- Decorative Technical Guide Lines -->
  <path d="M 0 38 H 1200 M 0 332 H 1200" class="tech-line" stroke-opacity="0.4" stroke-width="1"/>
  <path d="M 680 38 V 332" class="tech-line" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M 0 38 H 680" stroke="url(#primaryGrad)" stroke-width="1.5" fill="none" class="scan-line"/>

  <!-- ================= LEFT CONTENT SECTION ================= -->
  
  <!-- Live Status Indicator -->
  <g transform="translate(68, 62)">
    <rect width="280" height="28" rx="14" class="status-badge-bg" fill-opacity="0.8" stroke-width="1"/>
    <circle cx="16" cy="14" r="4.5" fill="#10B981" class="pulse-dot"/>
    <text x="28" y="18" class="status-text" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">ACTIVE &amp; SHIPPING PRODUCTION</text>
  </g>

  <!-- Name & Title -->
  <text x="68" y="148" class="name-text" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" letter-spacing="-2">
    Vivek Kumar<tspan fill="#38BDF8">.</tspan>
  </text>
  <text x="68" y="186" fill="url(#primaryGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">
    Software Engineer &amp; Systems Architect
  </text>
  
  <!-- Monospace Code Tag Line -->
  <g transform="translate(68, 208)">
    <rect width="570" height="34" rx="8" class="code-bg" fill-opacity="0.8" stroke-width="1"/>
    <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" xml:space="preserve">
      <tspan fill="#6366F1">struct</tspan> <tspan fill="#38BDF8">SystemsEngineer</tspan> { <tspan fill="#94A3B8">scale:</tspan> <tspan fill="#34D399">"180+ APIs"</tspan>, <tspan fill="#94A3B8">latency:</tspan> <tspan fill="#F59E0B">"&lt;32ms"</tspan>, <tspan fill="#94A3B8">k8s:</tspan> <tspan fill="#A78BFA">true</tspan> }
    </text>
  </g>

  <!-- Bio & Location Sub-text -->
  <text x="68" y="272" class="desc-text" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Engineering dependable backend architectures, real-time WebRTC streams &amp; cloud systems.
  </text>
  <text x="68" y="296" class="sub-meta" font-family="'JetBrains Mono', monospace" font-size="11">
    📍 Chandigarh, India  ·  🎓 UIET Panjab University  ·  💡 500+ LeetCode DSA
  </text>

  <!-- Key Capability Badges Row -->
  <g transform="translate(68, 316)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="144" height="24" rx="6" fill="#1E1B4B" fill-opacity="0.8" stroke="#4338CA" stroke-width="1"/>
    <text x="72" y="16" fill="#C7D2FE" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Distributed Systems</text>
    
    <!-- Pill 2 -->
    <rect x="154" y="0" width="138" height="24" rx="6" fill="#062F4F" fill-opacity="0.8" stroke="#0284C7" stroke-width="1"/>
    <text x="223" y="16" fill="#BAE6FD" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">API Architecture</text>
    
    <!-- Pill 3 -->
    <rect x="302" y="0" width="138" height="24" rx="6" fill="#022C22" fill-opacity="0.8" stroke="#059669" stroke-width="1"/>
    <text x="371" y="16" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Real-Time &amp; Cloud</text>
  </g>


  <!-- ================= RIGHT CONTENT SECTION: SYSTEM ARCHITECTURE TOPOLOGY ================= -->
  
  <g transform="translate(710, 48)">
    <!-- Glassmorphic Outer Card -->
    <rect width="440" height="274" rx="16" class="hud-box" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <g transform="translate(0, 0)">
      <!-- MacOS Window Controls -->
      <circle cx="24" cy="20" r="4.5" fill="#EF4444" opacity="0.85"/>
      <circle cx="38" cy="20" r="4.5" fill="#F59E0B" opacity="0.85"/>
      <circle cx="52" cy="20" r="4.5" fill="#10B981" opacity="0.85"/>
      
      <!-- Tab Title -->
      <text x="74" y="24" class="hud-title" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">system_topology.yaml</text>
      <line x1="0" y1="40" x2="440" y2="40" class="hud-head-bar" stroke-width="1"/>
    </g>

    <!-- Topology Diagram (Nodes & Flows) -->
    <g transform="translate(10, 52)">
      
      <!-- Connection Flow Lines -->
      <!-- Client to Ingress -->
      <path d="M 40 90 H 84" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
      
      <!-- Ingress to Gateway -->
      <path d="M 124 90 H 168" stroke="#6366F1" stroke-width="2" class="packet-stream"/>
      
      <!-- Gateway to Microservices -->
      <!-- Path to ConnectSphere (Top) -->
      <path d="M 208 90 C 230 90, 230 42, 254 42" stroke="#0284C7" stroke-width="1.5" class="packet-stream"/>
      <!-- Path to Vaani WebRTC (Middle) -->
      <path d="M 208 90 H 254" stroke="#10B981" stroke-width="1.5" class="packet-stream"/>
      <!-- Path to Simple CDN (Bottom) -->
      <path d="M 208 90 C 230 90, 230 138, 254 138" stroke="#A855F7" stroke-width="1.5" class="packet-stream"/>
      
      <!-- Microservices to Data Layer -->
      <path d="M 354 42 C 372 42, 372 70, 386 70" stroke="#0284C7" stroke-width="1.5"/>
      <path d="M 354 90 H 386" stroke="#10B981" stroke-width="1.5"/>
      <path d="M 354 138 C 372 138, 372 110, 386 110" stroke="#A855F7" stroke-width="1.5"/>

      <!-- ================= NODES ================= -->

      <!-- Node 1: Client / Traffic -->
      <g transform="translate(10, 72)">
        <rect width="32" height="36" rx="6" class="hud-node-bg" stroke-width="1.2"/>
        <path d="M 20 84 L 32 84" stroke="#38BDF8" stroke-width="1.5"/>
        <circle cx="16" cy="18" r="6" fill="#334155"/>
        <text x="16" y="46" class="hud-node-text" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">CLIENT</text>
      </g>

      <!-- Node 2: Ingress / LB -->
      <g transform="translate(84, 72)">
        <rect width="40" height="36" rx="6" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
        <path d="M96 82h16M96 90h16M104 80v14" stroke="#818CF8" stroke-width="1.2" stroke-linecap="round"/>
        <text x="20" y="46" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">INGRESS</text>
      </g>

      <!-- Node 3: API Gateway -->
      <g transform="translate(168, 72)">
        <rect width="40" height="36" rx="6" fill="#0C4A6E" stroke="#0284C7" stroke-width="1.5"/>
        <path d="M 182 84 l 6 -4 l 6 4 v 8 l -6 4 l -6 -4 z" stroke="#38BDF8" stroke-width="1.2" fill="none"/>
        <text x="20" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">GATEWAY</text>
      </g>

      <!-- Node 4: ConnectSphere App Pod (Top) -->
      <g transform="translate(254, 24)">
        <rect width="100" height="34" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="1.5"/>
        <circle cx="12" cy="17" r="3" fill="#2DD4BF"/>
        <text x="20" y="16" fill="#5EEAD4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">ConnectSphere</text>
        <text x="20" y="27" fill="#99F6E4" font-family="'JetBrains Mono', monospace" font-size="8">180+ APIs · AI</text>
      </g>

      <!-- Node 5: Vaani WebRTC Stream (Middle) -->
      <g transform="translate(254, 72)">
        <rect width="100" height="34" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
        <circle cx="12" cy="17" r="3" fill="#34D399"/>
        <text x="20" y="16" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Vaani Platform</text>
        <text x="20" y="27" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="8">&lt;32ms Audio VAD</text>
      </g>

      <!-- Node 6: Simple CDN C++17 (Bottom) -->
      <g transform="translate(254, 120)">
        <rect width="100" height="34" rx="6" fill="#3B0764" stroke="#9333EA" stroke-width="1.5"/>
        <circle cx="12" cy="17" r="3" fill="#C084FC"/>
        <text x="20" y="16" fill="#E9D5FF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">Simple CDN</text>
        <text x="20" y="27" fill="#F3E8FF" font-family="'JetBrains Mono', monospace" font-size="8">C++17 Edge Nodes</text>
      </g>

      <!-- Node 7: Multi-Layer DB & Redis Cluster -->
      <g transform="translate(386, 68)">
        <!-- DB Cluster Cylinders -->
        <path d="M 0 4 C 0 8, 24 8, 24 4 C 24 0, 0 0, 0 4 Z" fill="#022C22" stroke="#10B981" stroke-width="1.2"/>
        <path d="M 0 4 V 16 C 0 20, 24 20, 24 16 V 4" fill="#022C22" stroke="#10B981" stroke-width="1.2"/>
        <path d="M 0 16 V 28 C 0 32, 24 32, 24 28 V 16" fill="#022C22" stroke="#10B981" stroke-width="1.2"/>
        <path d="M 0 28 V 40 C 0 44, 24 44, 24 40 V 28" fill="#022C22" stroke="#10B981" stroke-width="1.2"/>
        
        <text x="12" y="52" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" text-anchor="middle">DATA</text>
      </g>

    </g>

    <!-- Bottom Telemetry Status Console -->
    <g transform="translate(16, 226)">
      <rect width="408" height="32" rx="6" class="hud-k8s-box" stroke-width="1"/>
      <circle cx="14" cy="16" r="3.5" fill="#10B981" class="pulse-dot"/>
      <text x="26" y="20" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">Cluster Status: Healthy</text>
      <text x="240" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">99.9% Uptime · 0 Alerts</text>
    </g>

  </g>
</svg>
