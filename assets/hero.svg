<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vivek Kumar - Software Engineer &amp; Systems Architect">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6"/>
      <circle cx="40" cy="0" r="1.5" fill="#334155" opacity="0.8"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes roleCycle1 {
        0%, 28% { opacity: 1; transform: translateY(0px); }
        33%, 95% { opacity: 0; transform: translateY(-12px); }
        100% { opacity: 1; transform: translateY(0px); }
      }
      @keyframes roleCycle2 {
        0%, 28% { opacity: 0; transform: translateY(12px); }
        33%, 61% { opacity: 1; transform: translateY(0px); }
        66%, 100% { opacity: 0; transform: translateY(-12px); }
      }
      @keyframes roleCycle3 {
        0%, 61% { opacity: 0; transform: translateY(12px); }
        66%, 95% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(-12px); }
      }
      @keyframes streamPulse {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 60; }
      }
      
      .status-pulse {
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 888px 64px;
      }
      .role-1 { animation: roleCycle1 9s ease-in-out infinite; }
      .role-2 { animation: roleCycle2 9s ease-in-out infinite; }
      .role-3 { animation: roleCycle3 9s ease-in-out infinite; }
      .stream-line {
        stroke-dasharray: 8 12;
        animation: streamPulse 6s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Canvas with Rounded Corners & Border -->
  <rect width="1280" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1280" height="420" rx="20" fill="url(#circuitGrid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="100" r="180" fill="#3B82F6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1100" cy="320" r="160" fill="#10B981" opacity="0.06" filter="url(#glow)"/>

  <!-- Decorative Circuit Lines -->
  <path d="M 60 40 L 400 40 L 440 80 L 760 80" stroke="#1E293B" stroke-width="1.5" fill="none"/>
  <path d="M 760 80 L 800 40 L 1220 40" stroke="#1E293B" stroke-width="1.5" fill="none"/>
  <path d="M 120 380 L 520 380 L 560 340 L 1180 340" stroke="#1E293B" stroke-width="1.5" fill="none" class="stream-line" stroke="#334155"/>

  <!-- Left Main Column (Hero Identity) -->
  <!-- Top Tagline Badge -->
  <g transform="translate(68, 52)">
    <rect width="320" height="28" rx="14" fill="#1E293B" fill-opacity="0.7" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#3B82F6"/>
    <text x="26" y="18" fill="#93C5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">FULL-STACK &amp; SYSTEMS ARCHITECT</text>
  </g>

  <!-- Main Name Title -->
  <text x="68" y="152" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Vivek Kumar<tspan fill="#3B82F6">.</tspan></text>

  <!-- Animated Role Switcher -->
  <g transform="translate(68, 196)">
    <text x="0" y="0" fill="#64748B" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="500">&gt; specialize_in:</text>
    
    <!-- Dynamic Roles -->
    <g class="role-1" transform="translate(170, 0)">
      <text x="0" y="0" fill="#60A5FA" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="700">&quot;Scalable Distributed Systems&quot;</text>
    </g>
    <g class="role-2" transform="translate(170, 0)">
      <text x="0" y="0" fill="#34D399" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="700">&quot;High-Throughput Real-Time APIs&quot;</text>
    </g>
    <g class="role-3" transform="translate(170, 0)">
      <text x="0" y="0" fill="#F472B6" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="700">&quot;Production-Grade Web Platforms&quot;</text>
    </g>
  </g>

  <!-- Brief Bio Line -->
  <text x="68" y="248" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
    Engineering dependable backend architectures, real-time media pipelines, and robust full-stack applications.
  </text>
  <text x="68" y="274" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    📍 Chandigarh, India &nbsp;·&nbsp; 🎓 UIET Panjab University &nbsp;·&nbsp; 💡 500+ Algorithmic Problems Solved
  </text>

  <!-- Left Stats / Capabilities Pills -->
  <g transform="translate(68, 312)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="136" height="34" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
    <text x="14" y="21" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">⚡ &lt;500ms Latency</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="146" height="34" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
    <text x="162" y="21" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🛡️ 180+ REST APIs</text>

    <!-- Pill 3 -->
    <rect x="306" y="0" width="168" height="34" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
    <text x="320" y="21" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🌐 Regional C++ CDN</text>

    <!-- Pill 4 -->
    <rect x="486" y="0" width="160" height="34" rx="8" fill="#111827" stroke="#1E293B" stroke-width="1.2"/>
    <text x="500" y="21" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">🤖 Gemini AI Workflows</text>
  </g>

  <!-- Right Side System Telemetry HUD Panel -->
  <g transform="translate(840, 36)">
    <!-- HUD Card Container -->
    <rect width="380" height="348" rx="16" fill="url(#panelGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect width="380" height="38" rx="16" fill="#1E293B" fill-opacity="0.5"/>
    <path d="M 0 38 L 380 38" stroke="#334155" stroke-width="1"/>

    <!-- HUD Header -->
    <circle cx="24" cy="19" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="40" cy="19" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="56" cy="19" r="5" fill="#10B981" opacity="0.8"/>
    <text x="80" y="23" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">SYSTEM_STATUS // LIVE</text>

    <!-- Availability Live Beacon -->
    <g class="status-pulse">
      <circle cx="48" cy="64" r="8" fill="#10B981" fill-opacity="0.3"/>
      <circle cx="48" cy="64" r="4" fill="#10B981"/>
    </g>
    <text x="64" y="68" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">STATUS: OPEN FOR ROLES</text>

    <!-- Metric Rows -->
    <!-- Row 1: Core Stack -->
    <g transform="translate(24, 96)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">CORE_LANGUAGES</text>
      <text x="332" y="14" text-anchor="end" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">TypeScript · C++17 · Go</text>
      <line x1="0" y1="26" x2="332" y2="26" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Row 2: Architecture -->
    <g transform="translate(24, 138)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">BACKEND_ARCH</text>
      <text x="332" y="14" text-anchor="end" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Microservices / Event-Driven</text>
      <line x1="0" y1="26" x2="332" y2="26" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Row 3: Realtime & Cache -->
    <g transform="translate(24, 180)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">REALTIME_LAYER</text>
      <text x="332" y="14" text-anchor="end" fill="#F472B6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">WebRTC · Socket.IO · Redis</text>
      <line x1="0" y1="26" x2="332" y2="26" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Row 4: Cloud & DevOps -->
    <g transform="translate(24, 222)">
      <text x="0" y="14" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">CONTAINER_OPS</text>
      <text x="332" y="14" text-anchor="end" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Docker · K8s · CI/CD</text>
      <line x1="0" y1="26" x2="332" y2="26" stroke="#1E293B" stroke-width="1"/>
    </g>

    <!-- Terminal Prompt CTA at bottom of HUD -->
    <g transform="translate(24, 276)">
      <rect width="332" height="46" rx="8" fill="#0B0F19" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="14" y="28" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">&gt; git commit -m &quot;Ship high impact&quot;</text>
    </g>
  </g>

  <!-- Glowing Accent Border on Entire Frame -->
  <rect x="0.75" y="0.75" width="1278.5" height="418.5" rx="19.25" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
